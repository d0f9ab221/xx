<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro YouTube Thumbnail Downloader</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="glass-container">
        <h1 class="title">Thumbnail <span>Extractor</span></h1>
        <div class="auth-section">
            <div id="googleSignInContainer" class="hidden">
                <div id="g_id_onload" data-client_id="YOUR_GOOGLE_CLIENT_ID_HERE" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
                <div class="g_id_signin" data-type="standard"></div>
            </div>
            <div id="userInfoContainer" class="user-info hidden">
                <img id="userProfilePic" src="" alt="User">
                <span id="userName"></span>
                <button id="signOutBtn">Sign Out</button>
            </div>
        </div>
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste YouTube URL here...">
            <button id="fetchBtn">Fetch Thumbnail</button>
        </div>
        <div id="result" class="result-card hidden">
            <img id="thumbImg" src="" alt="Thumbnail">
            <a id="downloadBtn" href="#" download>Download</a>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
